{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow border-0 rounded-lg">
            <div class="card-header bg-dark text-white text-center py-4">
                <h3 class="mb-0">🎲 準備開始遊玩</h3>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-4">
                        <label for="username" class="form-label text-muted">請輸入您的遊戲暱稱</label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="例如：桌遊大師" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">進入大廳</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
